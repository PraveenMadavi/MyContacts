<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(content)">

<head>
  <!-- Required meta tags -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Favicon -->
  <!-- <link rel="icon" th:href="@{/img/MyContactsY.png}" type="image/x-icon"> -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=contacts" />

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  
    <!-- custon stylesheets -->
  <link rel="stylesheet" th:href="@{/css/styles.css}">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  
     <!-- Custom JavaScript -->
  <script th:src="@{/js/script.js}" defer></script>

  <title th:text="${title}">Base page</title>
</head>

<body>
  <!-- NAV BAR------------------------------------------------------------------>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">SmartContactManager</a>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">

        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link active" aria-current="page" th:href="@{/home}">Home</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" th:text="${user.name}"></a>
          </li>

          <li class="nav-item">
            <form th:action="@{/logout}" method="post" style="display: inline;">
              <button type="submit" class="btn btn-link nav-link">
                Logout
              </button>
            </form>
          </li>

        </ul>

      </div>
    </div>
  </nav>



  <!-- SIDEBAR------------------------------------------------------------------>
  <div class="sidebar">
    <span onclick="toggleSidebar()" class="crossbtn">&times;</span>
    <a th:href="@{/user/index}" class="item"><i class="fa-duotone fa-solid fa-house"></i> Home</a>
    <a th:href="@{/user/mycontacts}" class="item"><i class="fa-duotone fa-solid fa-address-card"></i> My Contacts</a>
    <a th:href="@{/user/addContact}" class="item"><i class="fa-duotone fa-solid fa-plus"></i> Add Contact</a>
    <a href="#" class="item"><i class="fa-duotone fa-solid fa-gear"></i> Settings</a>
    <a href="#" class="item"><i class="fa-duotone fa-solid fa-right-from-bracket"></i> Log Out</a>
  </div>

  <!-- Placeholder where content from home.html will be inserted -->
  <div class="content">
    <span class="bars">
      <i onclick="toggleSidebar()" class="fa-solid fa-bars"></i>
    </span>

    <div th:insert="${content}"></div>
  </div>


  <!-- Optional JavaScript; choose one of the two! -->

  <!-- Option 1: Bootstrap Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
    crossorigin="anonymous"></script>

  <!-- Option 2: Separate Popper and Bootstrap JS -->
  <!--
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.10.2/dist/umd/popper.min.js" integrity="sha384-7+zCNj/IqJ95wo16oMtfsKbZ9ccEh31eOz1HGyDuCQ6wgnyJNSYdrPa03rtR1zdB" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.min.js" integrity="sha384-QJHtvGhmr9XOIpI6YVutG+2QOK9T+ZnN4kzFN1RtK3zEFEIsxhlmWl5/YESvpZ13" crossorigin="anonymous"></script>
    -->
</body>

</html>
